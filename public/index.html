    <script>
      (() => {
        const ecosystemUrl = "https://zeentinelia-iq3xb4ed.manus.space/#ecosistema";
        const poolLandingUrl = "https://piscinas-95vs3hjd.manus.space";
        const openEcosystemSeparately = () => {
          document.querySelectorAll(`a[href="${ecosystemUrl}"]`).forEach((link) => {
            link.target = "_blank";
            link.rel = "noopener noreferrer";
            link.setAttribute("aria-label", "Obrir l'Ecosistema Zeentinelia en una pestanya nova");
          });
        };
        const openPoolLanding = () => {
          document.querySelectorAll('a[href="/mantenimiento-piscinas"]').forEach((link) => {
            link.href = poolLandingUrl;
            link.target = "_self";
            link.removeAttribute("rel");
            link.setAttribute("aria-label", "Obrir la landing de Manteniment de Piscines");
          });
        };

        const root = document.getElementById("root");
        if (root) {
          new MutationObserver(() => {
            openEcosystemSeparately();
            openPoolLanding();
          }).observe(root, { childList: true, subtree: true });
        }
        openEcosystemSeparately();
        openPoolLanding();
      })();
    </script>
